apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8s-deployment
  namespace: dev
  annotations:
      circleci.com/project-id: 63737856-f8cf-4409-bff2-33e2a4bf0752
  labels:
      circleci.com/component-name: my-k8s-app
      circleci.com/version: 1.0.0
      app: my-k8s-app
spec:
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
        circleci.com/component-name: my-k8s-app
        circleci.com/version: 1.0.0
    spec:
      containers:
      - name: my-container
        image: christophedube09/my-k8s-app:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
      RestartPolicy: Always